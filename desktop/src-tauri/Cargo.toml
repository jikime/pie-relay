[package]
name = "pie-relay-desktop"
version = "0.1.0"
description = "Pie Relay Desktop by cookai.dev"
authors = ["PieLab"]
edition = "2021"
rust-version = "1.77.2"

# The library holds the app entry point; main.rs is a thin wrapper so the same
# `run()` can serve desktop and (future) mobile targets.
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enabled by tauri when building with a custom protocol (production assets).
custom-protocol = ["tauri/custom-protocol"]
