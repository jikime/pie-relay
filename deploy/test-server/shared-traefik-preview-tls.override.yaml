name: kroot-shared-edge

# 기존 Kroot 공용 Traefik Compose에만 겹쳐 사용하는 작은 override다.
# 원본 compose/command/resolver를 수정하지 않고 Pie Preview wildcard 인증서만
# file provider에 추가한다. 인증서 원본(Certbot account)은 마운트하지 않는다.
services:
  kroot-shared-lb:
    volumes:
      - type: bind
        source: /home/kaonkroot/pie-sandbox-test/preview-tls
        target: /etc/traefik/pie-preview-tls
        read_only: true
    configs:
      - source: pie-preview-tls-dynamic
        target: /etc/traefik/dynamic/pie-preview-tls.yml

configs:
  pie-preview-tls-dynamic:
    content: |
      tls:
        certificates:
          - certFile: /etc/traefik/pie-preview-tls/fullchain.pem
            keyFile: /etc/traefik/pie-preview-tls/privkey.pem
